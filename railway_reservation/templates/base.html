<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Railway Reservation{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head><body>
<header class="nav"><div class="wrap navin">
  <a class="logo" href="{{ url_for('dashboard') }}">🚆 Railway Reservation</a>
  <button class="burger" id="burger" aria-label="Menu">☰</button>
  <nav id="menu">
    {% set ep = request.endpoint %}
    <a href="{{ url_for('dashboard') }}" class="{{ 'on' if ep=='dashboard' }}">Home</a>
    <a href="{{ url_for('search') }}" class="{{ 'on' if ep in ('search','book') }}">Search Trains</a>
    <a href="{{ url_for('my_bookings') }}" class="{{ 'on' if ep=='my_bookings' }}">My Bookings</a>
    <a href="{{ url_for('waiting_list') }}" class="{{ 'on' if ep=='waiting_list' }}">Waiting List</a>
    <a href="{{ url_for('profile') }}" class="{{ 'on' if ep=='profile' }}">Profile</a>
    <a href="{{ url_for('logout') }}">Logout</a>
  </nav></div></header>
<main class="wrap">
  {% with msgs = get_flashed_messages(with_categories=true) %}{% for c, m in msgs %}
  <div class="flash {{ c }}">{{ m }}</div>{% endfor %}{% endwith %}
  {% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body></html>
